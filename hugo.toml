baseURL = 'https://mirasharitasi.com/'
languageCode = 'tr-TR'
title = 'Miras Haritası'
theme = []
disableAliases = true
enableRobotsTXT = true

# Pagination
[pagination]
  pagerSize = 24

# URL Structure
[permalinks]
  eserler = "/eserler/:slug/"
  iller = "/iller/:slug/"
  turler = "/turler/:slug/"

# Taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'
  province = 'iller'
  district = 'ilceler'
  type = 'turler'

# Output Formats (JSON for search)
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

# Sitemap Configuration
[sitemap]
  changefreq = "weekly"
  priority = 0.8
  filename = "sitemap.xml"

# Minification
[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
      keepEndTags = true
    [minify.tdewolff.css]
      precision = 0
    [minify.tdewolff.js]
      precision = 0
    [minify.tdewolff.json]
      precision = 0

# Image Processing
[imaging]
  quality = 85
  resampleFilter = "Lanczos"

# Site Parameters
[params]
  description = "Türkiye'nin 15,000+ kültürel mirası ve tarihi eserleri. Camiler, kaleler, müzeler, antik kentler. Detaylı bilgi, fotoğraflar ve konum bilgisi."
  author = "Miras Haritası"
  keywords = ["tarihi yerler", "kültürel miras", "türkiye müzeleri", "osmanlı eserleri", "antik kentler"]
  ogImage = "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Hagia_Sophia_Mars_2013.jpg/1200px-Hagia_Sophia_Mars_2013.jpg"
